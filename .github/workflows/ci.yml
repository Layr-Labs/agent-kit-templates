name: CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        working-directory: eigenpa
        run: bun install

      - name: Typecheck
        working-directory: eigenpa
        run: bun run typecheck

      - name: Run tests with coverage
        working-directory: eigenpa
        run: bunx vitest run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: eigenpa/coverage/lcov.info

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - if: github.event_name == 'pull_request'
        name: Report coverage in PR
        uses: Layr-Labs/cover-2@1.0.0
        with:
          head-lcov-file: coverage/lcov.info
          baseline-from: coverage-baseline

      - if: github.event_name == 'push'
        name: Save coverage baseline
        uses: Layr-Labs/cover-2@1.0.0
        with:
          head-lcov-file: coverage/lcov.info
          save-baseline: coverage-baseline
